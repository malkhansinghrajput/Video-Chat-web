version: '3.9'

services:
  # ─────────────────────────────────────────────
  # Redis — Central State Store
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: videochat_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - videochat_net

  # ─────────────────────────────────────────────
  # MongoDB — Persistent Storage
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: videochat_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: videochat_dev
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - videochat_net

  # ─────────────────────────────────────────────
  # Backend API + Signaling Server
  # ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videochat_backend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      SERVICE_NAME: api
      LOG_LEVEL: debug
      SESSION_HMAC_SECRET: dev-secret-change-in-production-12345
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      MONGODB_URI: mongodb://mongodb:27017/videochat_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TURN_SERVER_URLS: turn:localhost:3478
      TURN_SERVER_SECRET: dev-turn-secret
      HEARTBEAT_INTERVAL_MS: 25000
      RECONNECT_GRACE_PERIOD_MS: 5000
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./src:/app/src:delegated
    networks:
      - videochat_net

  # ─────────────────────────────────────────────
  # Mongo Express — Dev DB UI
  # ─────────────────────────────────────────────
  mongo_express:
    image: mongo-express:latest
    container_name: videochat_mongo_ui
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      - mongodb
    networks:
      - videochat_net

  # ─────────────────────────────────────────────
  # Redis Commander — Dev Redis UI
  # ─────────────────────────────────────────────
  redis_commander:
    image: rediscommander/redis-commander:latest
    container_name: videochat_redis_ui
    restart: unless-stopped
    ports:
      - '8082:8081'
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - videochat_net

volumes:
  redis_data:
  mongo_data:
  mongo_config:

networks:
  videochat_net:
    driver: bridge
