<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>VideoChatWeb — Free Anonymous Video Chat</title>
    <meta name="description" content="Connect instantly with people worldwide in 1-on-1 video chats. Fast, secure, free, and anonymous video call platform." />
    <meta name="theme-color" content="#0A0A0F" />

    <!-- Canonical -->
    <link rel="canonical" href="https://videochatweb.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://videochatweb.com/" />
    <meta property="og:title" content="VideoChatWeb — Free Anonymous Video Chat" />
    <meta property="og:description" content="Connect instantly with people worldwide in 1-on-1 video chats. Fast, secure, free, and anonymous." />
    <!-- og:image requires a hosted image — add absolute URL once available -->
    <!-- <meta property="og:image" content="https://videochatweb.com/og-image.png" /> -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VideoChatWeb — Free Anonymous Video Chat" />
    <meta name="twitter:description" content="Connect instantly with people worldwide in 1-on-1 video chats. Fast, secure, free, and anonymous." />
    <!-- <meta name="twitter:image" content="https://videochatweb.com/og-image.png" /> -->

    <!-- Robots: noindex for the /chat application route is handled in robots.txt -->
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
